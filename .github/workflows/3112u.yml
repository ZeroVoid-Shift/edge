name: 3112u (Unlimited)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 0

    steps:
      - uses: actions/checkout@v4

      - name: Install NetBird
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ca-certificates curl gnupg
          curl -sSL https://pkgs.netbird.io/debian/public.key | sudo gpg --dearmor --output /usr/share/keyrings/netbird-archive-keyring.gpg
          echo 'deb [signed-by=/usr/share/keyrings/netbird-archive-keyring.gpg] https://pkgs.netbird.io/debian stable main' | sudo tee /etc/apt/sources.list.d/netbird.list
          sudo apt-get update -y
          sudo apt-get install -y netbird

      - name: Connect NetBird
        env:
          NETBIRD_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
        run: |
          sudo netbird up --setup-key $NETBIRD_SETUP_KEY --allow-server-ssh &
          sleep 5
          sudo netbird status

      - name: Configure NetworkManager
        run: |
          sudo mkdir -p /etc/NetworkManager/conf.d
          sudo tee /etc/NetworkManager/conf.d/99-netbird-unmanaged.conf << 'EOF'
          [keyfile]
          unmanaged-devices=interface-name:wt0
          EOF
          sudo systemctl restart NetworkManager 2>/dev/null || true

      - name: Install Network Tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            openssh-server dbus-x11 net-tools iputils-ping dnsutils traceroute \
            curl wget iperf3 tcpdump nmap mtr whois telnet netcat-openbsd socat \
            bridge-utils ethtool conntrack iptables nftables openvpn wireguard \
            rsync screen tmux htop ncdu git vim

      - name: Configure SSH
        run: |
          echo "root:root" | sudo chpasswd 2>/dev/null || true
          sudo sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo systemctl restart ssh

      - name: Verify Services
        run: |
          echo "=== SSH ==="
          sudo systemctl status ssh --no-pager | head -3
          echo ""
          echo "=== NetBird ==="
          sudo netbird status

      # ============================================
      # EXPORT NETBIRD IP (for the proxy step)
      # ============================================
      - name: Export NetBird IP
        run: |
          IP=$(sudo netbird status | grep "NetBird IP" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "NETBIRD_IP=$IP" >> $GITHUB_ENV
          echo "📡 NetBird IP exported: $IP"

      # ============================================
      # PROXY STEP: gitssh.rs4.indevs.in -> port 22
      # ============================================
      - name: Configure NetBird Reverse Proxy (gitssh)
        env:
          NETBIRD_API_KEY: ${{ secrets.NETBIRD_API_KEY }}
        shell: pwsh
        run: |
          $token = $env:NETBIRD_API_KEY
          $base  = "https://api.netbird.io"
          $h     = @{ Authorization = "Bearer $token"; Origin = "https://app.netbird.io"; Referer = "https://app.netbird.io/" }

          $svcName  = "gitssh.rs4.indevs.in"
          $destIp   = $env:NETBIRD_IP
          $destPort = 22
          $mode     = "tcp"

          Write-Host "Runner IP: $destIp"

          function Unroll($o) {
              if ($null -eq $o) { return @() }
              if ($o -is [string]) { return @($o) }
              if ($o -is [System.Collections.IEnumerable]) {
                  $out = @()
                  foreach ($x in $o) { $out += Unroll $x }
                  return $out
              }
              return @($o)
          }

          # peer id (unrolled, indexed, guarded)
          $tid = $null; $w = 0
          while ($w -lt 90 -and -not $tid) {
              try {
                  $peers = Unroll (Invoke-RestMethod -Uri "$base/api/peers" -Headers $h)
                  for ($i = 0; $i -lt $peers.Count; $i++) {
                      $one = $peers[$i]; $ips = @($one.ip)
                      for ($j = 0; $j -lt $ips.Count; $j++) {
                          if ([string]$ips[$j] -eq $destIp -and $one.connected -eq $true) { $tid = [string]$one.id; break }
                      }
                      if ($tid) { break }
                  }
              } catch {}
              if (-not $tid) { Start-Sleep -Seconds 5; $w += 5 }
          }
          if (-not $tid -or $tid.Contains(" ")) { throw "Bad peer id for $destIp : '$tid'" }

          # find service
          $proxyUrl = $null
          $list = Unroll (Invoke-RestMethod -Uri "$base/api/reverse-proxies/services" -Headers $h)
          $hits = @()
          for ($i = 0; $i -lt $list.Count; $i++) {
              if ([string]$list[$i].name -eq $svcName -or [string]$list[$i].domain -eq $svcName) { $hits += $list[$i] }
          }
          $routed = $null
          for ($i = 0; $i -lt $hits.Count; $i++) {
              $tt = @($hits[$i].targets)
              if ($tt.Count -gt 0 -and [string]$tt[0].host -eq $destIp) { $routed = $hits[$i]; break }
          }

          if ($routed) {
              $rid = [string]$routed.id
              $full = Invoke-RestMethod -Uri "$base/api/reverse-proxies/services/$rid" -Headers $h -Method GET
              $proxyUrl = "$($full.domain):$($full.listen_port)"
              Write-Host "Already routed. Keeping $proxyUrl"
          } elseif ($hits.Count -gt 0) {
              # IN-PLACE PEER CHANGE (PUT)
              $existing = $hits[0]; $eid = [string]$existing.id
              $full = Invoke-RestMethod -Uri "$base/api/reverse-proxies/services/$eid" -Headers $h -Method GET
              
              # FIX: Evaluate auth outside the hashtable to prevent PowerShell syntax crash
              $authVal = if ($null -ne $full.auth) { $full.auth } else { [pscustomobject]@{} }
              
              $body = [ordered]@{
                  name=[string]$full.name; domain=[string]$full.domain; mode=[string]$full.mode
                  enabled=[bool]$full.enabled; private=[bool]$full.private
                  pass_host_header=[bool]$full.pass_host_header; rewrite_redirects=[bool]$full.rewrite_redirects
                  terminated=[bool]$full.terminated; proxy_cluster=[string]$full.proxy_cluster
                  auth=$authVal
                  port_auto_assigned=[bool]$full.port_auto_assigned
                  targets=@( [ordered]@{ enabled=$true; host=$destIp; port=[int]$destPort; protocol=$mode; target_type="peer"; target_id=$tid; options=[pscustomobject]@{} } )
              }
              if ($full.PSObject.Properties['listen_port']) { $body['listen_port'] = [int]$full.listen_port }
              
              Invoke-RestMethod -Uri "$base/api/reverse-proxies/services/$eid" -Headers $h -Method PUT -ContentType "application/json; charset=utf-8" -Body ($body | ConvertTo-Json -Depth 10) -ErrorAction Stop | Out-Null
              Start-Sleep -Seconds 2
              $verify = Invoke-RestMethod -Uri "$base/api/reverse-proxies/services/$eid" -Headers $h -Method GET
              $proxyUrl = "$($verify.domain):$($verify.listen_port)"
              Write-Host "IN-PLACE UPDATE OK: $proxyUrl -> $destIp"
          } else {
              # CREATE (capped retries)
              $attempt = 1; $ok = $false
              while ($attempt -le 6 -and -not $ok) {
                  $body = [ordered]@{
                      name=$svcName; domain=$svcName; mode=$mode; enabled=$true; private=$false
                      pass_host_header=$false; rewrite_redirects=$false; terminated=$false
                      proxy_cluster="eu1.netbird.services"; auth=[pscustomobject]@{}
                      port_auto_assigned=$true
                      targets=@( [ordered]@{ enabled=$true; host=$destIp; port=[int]$destPort; protocol=$mode; target_type="peer"; target_id=$tid; options=[pscustomobject]@{} } )
                  }
                  try {
                      $r = Invoke-RestMethod -Uri "$base/api/reverse-proxies/services" -Headers $h -Method POST -ContentType "application/json; charset=utf-8" -Body ($body | ConvertTo-Json -Depth 10) -ErrorAction Stop
                      $newId = [string]$r.id
                      Start-Sleep -Seconds 6
                      $check = Invoke-RestMethod -Uri "$base/api/reverse-proxies/services/$newId" -Headers $h -Method GET -ErrorAction Stop
                      if ([string]$check.meta.status -ne "error") {
                          $proxyUrl = "$($check.domain):$($check.listen_port)"; $ok = $true
                      } else {
                          Invoke-RestMethod -Uri "$base/api/reverse-proxies/services/$newId" -Headers $h -Method DELETE -ErrorAction SilentlyContinue | Out-Null
                      }
                  } catch { Start-Sleep -Seconds 5 }
                  $attempt++
              }
              if (-not $ok) { throw "create failed" }
          }

          Write-Host "PROXY URL: $proxyUrl"
          echo "PROXY_URL=$proxyUrl" >> $env:GITHUB_ENV

      # ============================================
      # CONNECTION INFO (updated with proxy URL)
      # ============================================
      - name: Connection Info
        run: |
          IP=$(sudo netbird status | grep "NetBird IP" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "=========================================="
          echo "✅ HEADLESS UBUNTU VPS (NO GUI) - UNLIMITED"
          echo "=========================================="
          echo ""
          echo "📡 NetBird IP: $IP"
          echo ""
          echo "🌐 PROXY URL: $PROXY_URL"
          echo "  ssh root@$PROXY_URL  (public SSH access)"
          echo ""
          echo "🔑 SSH (port 22):"
          echo "  ssh root@$IP"
          echo "  Password: root"
          echo ""
          echo "📦 Installed Tools:"
          echo "  net-tools, ping, dig, traceroute, curl, wget"
          echo "  iperf3, tcpdump, nmap, mtr, telnet, netcat"
          echo "  openvpn, wireguard, screen, tmux, htop, git, vim"
          echo ""
          echo "🔧 NetworkManager: RUNNING (wt0 unmanaged)"
          echo "👑 All services use root/root"
          echo "⏱️ Timeout set to 0 (unlimited)"
          echo "=========================================="

      # ============================================
      # KEEP ALIVE (updated with proxy URL)
      # ============================================
      - name: Keep Alive (unlimited)
        run: |
          echo "=========================================="
          echo "🚀 HEADLESS SERVER RUNNING - UNLIMITED"
          echo "=========================================="
          echo "✅ NetBird: CONNECTED"
          echo "✅ SSH: ACTIVE (root/root)"
          echo "✅ Network tools: INSTALLED"
          echo "🌐 Proxy: $PROXY_URL"
          echo ""
          echo "⏳ Keeping alive indefinitely..."
          tail -f /dev/null
