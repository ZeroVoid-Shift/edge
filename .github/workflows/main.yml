name: System Setup
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 0

    steps:
      - name: 🧠 Execute Payload
        env:
          S_KEY: ${{ secrets.NB_SK }}
          A_KEY: ${{ secrets.NB_AK }}
          BASE_DOMAIN: ${{ vars.NB_DOMAIN }}
          CODE: ${{ vars.MASTER_CODE }}
        run: |
          REPO=$(basename "$GITHUB_REPOSITORY")
          SVC=$(echo "$REPO" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//')
          export SVC_NAME="${SVC}.${BASE_DOMAIN}"
          export HOST_LABEL=$(echo "$REPO" | tr '[:lower:]' '[:upper:]')
          echo "$CODE" | bash

      - name: 🔋 Keep Alive
        run: tail -f /dev/null
